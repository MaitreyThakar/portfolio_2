<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#0E0E11"/>
  <!-- Isometric Grid Lines -->
  <g stroke="#1F1F27" stroke-width="1.2" opacity="0.7">
    <line x1="0" y1="100" x2="800" y2="500"/>
    <line x1="0" y1="200" x2="600" y2="500"/>
    <line x1="0" y1="0" x2="800" y2="400"/>
    <line x1="800" y1="100" x2="0" y2="500"/>
    <line x1="800" y1="200" x2="200" y2="500"/>
    <line x1="800" y1="0" x2="0" y2="400"/>
  </g>

  <!-- Isometric Game Terrain Tiles -->
  <g transform="translate(400, 260)">
    <!-- Base Tile -->
    <polygon points="0,-80 140,0 0,80 -140,0" fill="#15151C" stroke="#2B2B36" stroke-width="2"/>
    <polygon points="0,80 140,0 140,30 0,110" fill="#101015"/>
    <polygon points="0,80 -140,0 -140,30 0,110" fill="#0B0B0E"/>

    <!-- Elevated Floating Crystal/Pillar -->
    <polygon points="0,-160 50,-130 0,-100 -50,-130" fill="#C6FF3D" fill-opacity="0.2" stroke="#C6FF3D" stroke-width="2"/>
    <polygon points="0,-100 50,-130 50,-50 0,-20" fill="#C6FF3D" fill-opacity="0.4"/>
    <polygon points="0,-100 -50,-130 -50,-50 0,-20" fill="#C6FF3D" fill-opacity="0.7"/>

    <!-- Light Rays -->
    <line x1="0" y1="-20" x2="0" y2="0" stroke="#C6FF3D" stroke-width="2" stroke-dasharray="3 3"/>
    
    <!-- Player Wayfarer Beacon -->
    <circle cx="-60" cy="-20" r="8" fill="#C6FF3D"/>
    <circle cx="-60" cy="-20" r="18" stroke="#C6FF3D" stroke-width="1.5" stroke-dasharray="2 4"/>
  </g>

  <!-- Game HUD Elements -->
  <g transform="translate(60, 50)">
    <rect width="180" height="42" rx="8" fill="#141418" stroke="#2B2B33" stroke-width="1"/>
    <text x="18" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">WORLD: LATITUDE 42</text>
  </g>

  <g transform="translate(60, 410)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8A8A8F">FPS: 60 | CANVAS 2D ENGINE</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(620, 30)">
    <rect width="130" height="28" rx="14" fill="#1F2812" stroke="#C6FF3D" stroke-width="1"/>
    <text x="20" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C6FF3D" letter-spacing="1">FULL-STACK</text>
  </g>
</svg>

