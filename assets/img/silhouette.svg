<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6FF3D" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C6FF3D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#C6FF3D" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rim Glow Behind Silhouette -->
  <ellipse cx="400" cy="420" rx="260" ry="340" fill="#C6FF3D" fill-opacity="0.04" filter="url(#glowFilter)" />

  <!-- Shoulders & Torso -->
  <path d="M 120 950 C 140 760 220 660 310 610 C 340 640 460 640 490 610 C 580 660 660 760 680 950 Z" 
        fill="url(#bodyGrad)" stroke="#232328" stroke-width="2"/>
  
  <!-- Accent Jacket Rim Light -->
  <path d="M 120 950 C 140 760 220 660 310 610" 
        stroke="#C6FF3D" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#glowFilter)"/>
  <path d="M 490 610 C 580 660 660 760 680 950" 
        stroke="#F2F2F0" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Neck -->
  <path d="M 345 520 L 345 630 C 375 645 425 645 455 630 L 455 520 Z" 
        fill="#141418" stroke="#232328" stroke-width="1.5"/>

  <!-- Head Contour -->
  <path d="M 400 200 C 290 200 290 340 290 430 C 290 520 340 590 400 590 C 460 590 510 520 510 430 C 510 340 510 200 400 200 Z" 
        fill="url(#bodyGrad)" stroke="#232328" stroke-width="2"/>

  <!-- Left Jaw Rim Highlight -->
  <path d="M 300 370 C 290 450 330 540 400 590" 
        stroke="#C6FF3D" stroke-width="3.5" stroke-linecap="round" opacity="0.9" filter="url(#glowFilter)"/>

  <!-- Hair / Crown Silhouette -->
  <path d="M 285 360 C 275 260 330 170 400 160 C 475 150 525 240 515 350 C 485 280 440 250 400 250 C 350 250 310 290 285 360 Z" 
        fill="#0E0E12" stroke="#232328" stroke-width="1.5"/>
  <path d="M 285 360 C 275 260 330 170 400 160" 
        stroke="#C6FF3D" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- High-Tech Geometric Monogram Tag -->
  <g transform="translate(350, 720)">
    <rect x="0" y="0" width="100" height="32" rx="16" fill="#0A0A0B" stroke="#C6FF3D" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="20" cy="16" r="4" fill="#C6FF3D"/>
    <text x="34" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F2F2F0" letter-spacing="1.5">DEV</text>
  </g>
</svg>

