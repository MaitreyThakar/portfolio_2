<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" fill="none">
  <rect width="1000" height="650" fill="#0A0A0C"/>
  <rect x="20" y="20" width="960" height="610" rx="14" fill="#0F1014" stroke="#C6FF3D" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Interface App Top Bar -->
  <rect x="20" y="20" width="960" height="54" rx="14" fill="#14151B"/>
  <rect x="20" y="64" width="960" height="10" fill="#14151B"/>
  <circle cx="50" cy="47" r="5" fill="#3D3D48"/>
  <circle cx="70" cy="47" r="5" fill="#3D3D48"/>
  <circle cx="90" cy="47" r="5" fill="#3D3D48"/>
  
  <text x="130" y="52" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#F2F2F0">GENAI POLICY COPILOT</text>
  <rect x="310" y="37" width="90" height="20" rx="10" fill="#1E2812"/>
  <circle cx="322" cy="47" r="3.5" fill="#C6FF3D"/>
  <text x="332" y="51" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#C6FF3D">OFFLINE OK</text>

  <!-- Left Sidebar Nav -->
  <g transform="translate(50, 95)">
    <rect width="210" height="500" rx="10" fill="#121318" stroke="#1F2028" stroke-width="1"/>
    <text x="20" y="35" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8A8A8F" letter-spacing="1">COLLECTIONS</text>
    
    <rect x="15" y="50" width="180" height="40" rx="8" fill="#1C1E26" stroke="#C6FF3D" stroke-width="1" stroke-opacity="0.5"/>
    <text x="30" y="75" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F2F2F0">HR Policy 2026.pdf</text>

    <text x="20" y="125" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#8A8A8F" letter-spacing="1">METRICS</text>
    <rect x="15" y="140" width="180" height="60" rx="8" fill="#16171E"/>
    <text x="25" y="162" font-family="'Inter', sans-serif" font-size="10" fill="#8A8A8F">SEMANTIC RECALL</text>
    <text x="25" y="187" font-family="'Anton', sans-serif" font-size="20" fill="#C6FF3D">99.4%</text>

    <rect x="15" y="215" width="180" height="60" rx="8" fill="#16171E"/>
    <text x="25" y="237" font-family="'Inter', sans-serif" font-size="10" fill="#8A8A8F">INFERENCE LATENCY</text>
    <text x="25" y="262" font-family="'Anton', sans-serif" font-size="20" fill="#F2F2F0">142 ms</text>
  </g>

  <!-- Main Chat Conversation Screen -->
  <g transform="translate(290, 95)">
    <!-- User Prompt Bubble -->
    <g transform="translate(260, 20)">
      <rect width="380" height="50" rx="14" fill="#1E2028" stroke="#2B2D38" stroke-width="1"/>
      <text x="20" y="31" font-family="'Inter', sans-serif" font-size="13" fill="#F2F2F0">What is the bereavement leave policy?</text>
    </g>

    <!-- AI Copilot Response Card -->
    <g transform="translate(10, 95)">
      <rect width="630" height="250" rx="14" fill="#14151B" stroke="#262833" stroke-width="1"/>
      <circle cx="35" cy="35" r="14" fill="#1A2412" stroke="#C6FF3D" stroke-width="1"/>
      <text x="29" y="39" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C6FF3D">AI</text>
      <text x="60" y="40" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F2F2F0">Local Copilot Response</text>

      <text x="35" y="85" font-family="'Inter', sans-serif" font-size="13" fill="#C2C2C9">According to Section 4.2 (Leaves &amp; Time-Off):</text>
      <text x="35" y="112" font-family="'Inter', sans-serif" font-size="13" fill="#E0E0E6">• Up to 5 consecutive paid business days for immediate family members.</text>
      <text x="35" y="137" font-family="'Inter', sans-serif" font-size="13" fill="#E0E0E6">• Additional flexibility available upon manager notification.</text>
      
      <rect x="35" y="175" width="230" height="34" rx="8" fill="#1B2212" stroke="#C6FF3D" stroke-width="1"/>
      <text x="50" y="196" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#C6FF3D">Source: HR_Policy.pdf · p. 18</text>
    </g>

    <!-- Action Prompt Bar -->
    <g transform="translate(10, 375)">
      <rect width="630" height="54" rx="27" fill="#111216" stroke="#2E303B" stroke-width="1.5"/>
      <text x="30" y="32" font-family="'Inter', sans-serif" font-size="13" fill="#6A6A75">Ask any question across HR guidelines...</text>
      <circle cx="595" cy="27" r="18" fill="#C6FF3D"/>
      <polygon points="591,22 602,27 591,32" fill="#0A0A0B"/>
    </g>
  </g>

  <!-- Watermark badge -->
  <g transform="translate(780, 560)">
    <rect width="170" height="36" rx="8" fill="#1E2812" stroke="#C6FF3D" stroke-width="1"/>
    <text x="25" y="23" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C6FF3D">PRODUCTION AI</text>
  </g>
</svg>

