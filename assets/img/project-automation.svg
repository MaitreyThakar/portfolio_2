<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" fill="#0E0E11"/>
  <!-- Canvas dots -->
  <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="15" cy="15" r="1.5" fill="#202026"/>
  </pattern>
  <rect width="800" height="500" fill="url(#dotGrid)"/>

  <!-- n8n Workflow Graph Simulation -->
  <g transform="translate(60, 140)">
    <!-- Node 1: Cron Trigger (Hourly) -->
    <rect x="20" y="70" width="140" height="80" rx="12" fill="#141418" stroke="#32323D" stroke-width="1.5"/>
    <circle cx="50" cy="110" r="14" fill="#C6FF3D"/>
    <text x="74" y="106" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">Cron Trigger</text>
    <text x="74" y="122" font-family="'Inter', sans-serif" font-size="10" fill="#8A8A8F">Hourly Scan</text>

    <!-- Connector 1 -->
    <path d="M 160 110 L 230 110" stroke="#C6FF3D" stroke-width="2"/>
    <circle cx="160" cy="110" r="4" fill="#C6FF3D"/>
    <circle cx="230" cy="110" r="4" fill="#C6FF3D"/>

    <!-- Node 2: BatchData API Query -->
    <rect x="230" y="70" width="160" height="80" rx="12" fill="#141418" stroke="#C6FF3D" stroke-width="1.5"/>
    <rect x="245" y="96" width="28" height="28" rx="6" fill="#1E2812"/>
    <text x="254" y="115" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C6FF3D">BD</text>
    <text x="282" y="106" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">BatchData API</text>
    <text x="282" y="122" font-family="'Inter', sans-serif" font-size="10" fill="#8A8A8F">High-Equity Leads</text>

    <!-- Connector splits -->
    <path d="M 390 110 C 440 110, 440 50, 490 50" stroke="#C6FF3D" stroke-width="2"/>
    <path d="M 390 110 C 440 110, 440 170, 490 170" stroke="#C6FF3D" stroke-width="2"/>

    <!-- Node 3A: Slack Alert -->
    <rect x="490" y="10" width="150" height="75" rx="12" fill="#141418" stroke="#32323D" stroke-width="1.5"/>
    <text x="515" y="44" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">Slack Webhook</text>
    <text x="515" y="60" font-family="'Inter', sans-serif" font-size="10" fill="#C6FF3D">#leads-channel</text>

    <!-- Node 3B: Email Dispatch -->
    <rect x="490" y="130" width="150" height="75" rx="12" fill="#141418" stroke="#32323D" stroke-width="1.5"/>
    <text x="515" y="164" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#F2F2F0">Email Digest</text>
    <text x="515" y="180" font-family="'Inter', sans-serif" font-size="10" fill="#8A8A8F">Instant Notification</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(610, 30)">
    <rect width="140" height="28" rx="14" fill="#1F2812" stroke="#C6FF3D" stroke-width="1"/>
    <text x="24" y="18" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C6FF3D" letter-spacing="1">N8N CLOUD</text>
  </g>
</svg>

